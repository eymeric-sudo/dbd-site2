<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow&display=swap">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/barre-nav.css">
  <link rel="stylesheet" href="../css/fiches.css">
</head>
<!-- cette page reutilise les fiches communes pour presenter les maps -->
<body class="page-fiches">

  <nav class="barre-nav">
    <a class="nav-logo" href="../index.html"><span><img src="../images/télécharger.gif" alt="" width="24" height="24"></span><b>Hub Spectral</b></a>
    <a href="../index.html"><span>🏠</span><b>Accueil</b></a>
    <a href="../pages/tueurs.html"><span>🔪</span><b>Tueurs</b></a>
    <a href="../pages/survivants.html"><span>🏃</span><b>Survivants</b></a>
    <a href="../pages/perks.html"><span>⭐</span><b>Perks</b></a>
    <a href="../pages/offrandes.html"><span>🕯️</span><b>Offrandes</b></a>
    <a href="../pages/objets.html"><span>🔦</span><b>Objets</b></a>
    <a class="actif" href="../pages/maps.html"><span>🗺️</span><b>Maps</b></a>
  </nav>

  <div class="fond"></div>

  <div class="contenu">

    <div class="titre-petit">● Maps</div>
    <h1>Maps</h1>
    <p>Clique sur une map pour voir ses infos.</p>

    <div class="mise-en-page">
    <div class="grille-fiches">

      <!-- fiche modele : renseigner le royaume la taille et la description de la map -->
      <label class="tuile-survivant">
        <input class="choix" type="radio" name="choix" checked>
        <span class="cadre-image mini-portrait" data-lettre="N"></span>
        <span class="nom-tuile">Nom de la map</span>
      </label>
      <div class="zone-droite">
        <div class="colonne-droite">
          <div class="panneau">
            <div class="panneau-haut">
              <div class="cadre-image grand-portrait" data-lettre="N"></div>
              <div>
                <h2 class="panneau-nom">Nom de la map</h2>
                <dl class="fiche">
                  <dt>Royaume</dt> <dd>Nom du royaume</dd>
                  <dt>Taille</dt> <dd>Petite / Moyenne / Grande</dd>
                </dl>
              </div>
            </div>
            <p class="panneau-description">Description</p>
          </div>
        </div>
      </div>

    </div>
    </div>

  </div>

</body>
</html>
